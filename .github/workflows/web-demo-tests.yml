name: Web demo tests
on:
  pull_request:
  push:
    branches: [main, copilot/fix-vulnerability]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './paddleocr_web_demo[dev]'
      - run: python -m pytest -q
        working-directory: paddleocr_web_demo
