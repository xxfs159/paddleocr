[project]
name = "paddleocr-web-demo"
version = "0.1.0"
description = "Local three-mode PaddleOCR demonstration website"
requires-python = ">=3.12"
dependencies = [
    "bleach>=6.2,<7",
    "fastapi>=0.115,<1",
    "markdown-it-py>=3.0,<4",
    "pillow>=11.0,<13",
    "pypdf>=5.0,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.18,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
